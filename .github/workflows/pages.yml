name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust WASM build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci
      - run: npm test
      - run: npm run verify:engine
      - run: npm run build
      - name: Prepare Brotli upload for Cloudflare Pages
        run: node scripts/prepare-cloudflare-pages.mjs dist cloudflare-pages-brotli
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: cloudflare-pages-brotli
          path: cloudflare-pages-brotli
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
  verify:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install Rust WASM build tools
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target wasm32-unknown-unknown
          cargo install wasm-pack --version 0.15.0 --locked
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify published files and runtime downloads
        run: npm run verify:pages -- https://appunni-m.github.io/tripelkins/
